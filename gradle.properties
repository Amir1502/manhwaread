org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true
# K2-UAST в lint (AGP 8.10.1) падает при анализе unit-тестов :app с ошибкой
# разрешения FIR ("Error while resolving FirRegularClassImpl from RAW_FIR",
# файл WebViewChallengeSolverTest.kt; сам AGP пишет "this is a bug in lint").
# До исправления бага AGP анализ lint выполняется через стабильный K1-UAST.
android.lint.useK2Uast=false
