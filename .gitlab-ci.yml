image: gradle:8.11.1-jdk17

stages:
  - test

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  ANDROID_HOME: "$CI_PROJECT_DIR/.android-sdk"

build-and-test:
  stage: test
  timeout: 45m
  before_script:
    - mkdir -p "$ANDROID_HOME/cmdline-tools"
    - curl --fail --location --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip --output /tmp/android-tools.zip
    - unzip -q /tmp/android-tools.zip -d "$ANDROID_HOME/cmdline-tools"
    - mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
    - export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
    - printf 'y\ny\ny\ny\ny\ny\ny\ny\ny\ny\n' | sdkmanager --licenses > /tmp/android-licenses.log
    - sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
  script:
    - gradle --no-daemon :core:test :sources:test :app:assembleDebug :app:lintDebug
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit:
        - core/build/test-results/test/TEST-*.xml
        - sources/build/test-results/test/TEST-*.xml
    paths:
      - app/build/outputs/apk/debug/*.apk
      - app/build/reports/lint-results-debug.html
      - core/build/reports/tests/test/
      - sources/build/reports/tests/test/
